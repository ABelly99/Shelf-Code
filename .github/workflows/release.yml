# Make a release on github.com (Releases → Draft a new release → tag v1.2.0 → Publish).
# This workflow then builds and attaches:
#   - Windows .exe, Linux tarballs, .deb/.rpm, installer, ZimaOS files, checksums
#   - multi-arch Docker image ghcr.io/abelly99/shelf-code (amd64, arm64, armv7)
# To rebuild an existing release: Actions → Release → Run workflow → enter its tag.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  GOTOOLCHAIN: auto
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  files:
    name: Build release files
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a version number
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag must be a version like v1.0.0 (this one is '$TAG'). Delete this release and its tag, then make a new release with a tag like v1.0.0."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: ./scripts/release.sh "${TAG#v}"

      - name: Publish files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # Made by hand on github.com: add the download notes if it has no description.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --title "SHELFCODE $TAG" --notes-file build/release-notes.md
            fi
          else
            gh release create "$TAG" dist/* --title "SHELFCODE $TAG" --notes-file build/release-notes.md
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a version number
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag must be a version like v1.0.0 (this one is '$TAG')."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
